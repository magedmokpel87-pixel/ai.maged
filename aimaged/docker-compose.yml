services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aimaged
      POSTGRES_PASSWORD: aimaged_password
      POSTGRES_DB: aimaged
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://aimaged:aimaged_password@postgres:5432/aimaged?schema=public
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
    ports:
      - '4000:4000'

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:4000
      - INTERNAL_API_BASE=http://backend:4000
    depends_on:
      - backend
    ports:
      - '3000:3000'

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=change_me
      - BACKEND_BASE_URL=http://backend:4000
      - N8N_API_KEY=replace-with-shared-secret
      - ANTHROPIC_API_KEY=replace-with-your-key
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows
    ports:
      - '5678:5678'

volumes:
  pgdata:
  n8n_data:
