# AI.MAGED — production compose for a single EC2 host.
# Usage (from the aimaged/ directory on the server):
#   cp deploy/.env.production.example .env   # then edit DOMAIN + secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# All services talk to each other on the internal compose network.
# Only nginx is published to the host (ports 80/443). Postgres/Backend/Frontend
# are never exposed directly.

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimaged}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aimaged}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimaged} -d ${POSTGRES_DB:-aimaged}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aimaged}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aimaged}?schema=public
      - UPLOAD_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Browser talks to the same public origin; nginx routes /api and /uploads to backend.
        - NEXT_PUBLIC_API_BASE=${PUBLIC_URL:?set PUBLIC_URL in .env e.g. https://aimaged.com}
    restart: always
    environment:
      - INTERNAL_API_BASE=http://backend:4000
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  uploads:
  certbot_www:
  certbot_conf:
