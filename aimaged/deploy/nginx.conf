# AI.MAGED reverse proxy — HTTP (ACME + redirect) + HTTPS.

server {
    listen 80 default_server;
    server_name aimaged.com www.aimaged.com 51.21.195.43 _;

    client_max_body_size 30m;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS (only for the domain; IP keeps serving HTTP)
    location / {
        if ($host = aimaged.com) { return 301 https://$host$request_uri; }
        if ($host = www.aimaged.com) { return 301 https://$host$request_uri; }
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aimaged.com www.aimaged.com;

    ssl_certificate     /etc/letsencrypt/live/aimaged.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aimaged.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
